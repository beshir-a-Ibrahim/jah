<h1>ሕድሪ (Dedication)</h1>
<p>ዲብ የናይር ሰነት 2008 እግል ሰልና: ዶል እብ ወዛረት እዕላም ለትጠበዐ።</p>
<p>እሊ ክታብ እሊ ማል ወምልክ ወዛረት እዕላም ቲ። እምበል እጃቛዘት ወዛረት እዕላም: እብ ተማሙ ልግበእ ወከፈፍሉ አትባዝሖቱ ወጥብዐቱ እብ ለገብአ ልግበእ ሸክል ምኖዕ ቱ።</p>
