<h1><span class="num">5.8</span>…… (ወለመስሉ)</h1>
<p>እለ&quot; ዕለመት እለ&quot;”&quot; ምነ&#x27; ካትባሙ ለህሌ’ነ ክቱብ ገሌ ለኢትሰመ ታርፍ ክም ህለ&#x27; እግል ነአክድ እንከርየ። ለበዝሐ ወክድ: መቃበለት እብ ክቱብ እንቀድመ እት ህሌ’ነ: ለህግየ ለበዐለ ቤለየ እብ ተማመ እግል ንክተበ ሰበ&#x27;ት ይእንቀድር: ገሌ ምነ&#x27; እንዴ ሰሜነ: ዕላመት አተላላይ (ወለመስሉ) እንወዴ ከንትዐደየ።</p>
