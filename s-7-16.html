<h1><span class="num">7.16</span>ገሌ ምን ገኖ ለልትሸቄ ሓጃት ወኣላት</h1>
<p>ህወት ~[ ቂቁመጦ<br>ሐድነት/ሐነት ዕከት መሰብ ሐርብ ] ምክላየት . ጸፍር<br>አብሪቅ ሸሊከት ቀርበት<br>ትግራት (ተርገ) መስወድ<br>መዳስ ዒዶ<br>ስንጋድ (ስንዳግ) ምራን<br>ሕብ ዐሙር<br>ስራክ ዐርሰት<br>ክምር (ክማር)<br>መዓጺት</p>
